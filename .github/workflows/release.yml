name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Package and publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const tag = process.env.RELEASE_TAG;
          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          const expected = `v${packageJson.version}`;
          if (!/^v\d+\.\d+\.\d+$/.test(tag) || tag !== expected) {
            console.error(`Release tag ${tag} must be the stable package version ${expected}`);
            process.exit(1);
          }
          NODE

      - name: Verify canonical assets and behavior
        run: npm run check

      - name: Build npm package
        run: |
          mkdir release
          npm pack --pack-destination release

      - name: Smoke test packaged CLI
        run: |
          npm install --global --prefix "$RUNNER_TEMP/agentpack-smoke" ./release/*.tgz
          actual_version="$("$RUNNER_TEMP/agentpack-smoke/bin/agentpack" --version)"
          expected_version="${GITHUB_REF_NAME#v}"
          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "Packaged CLI reported $actual_version; expected $expected_version" >&2
            exit 1
          fi

      - name: Write checksums
        run: sha256sum release/*.tgz > release/SHA256SUMS

      - name: Attest package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.tgz

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/*.tgz release/SHA256SUMS
          --verify-tag
          --generate-notes
          --title "AgentPack $GITHUB_REF_NAME"
          --latest
          --fail-on-no-commits
