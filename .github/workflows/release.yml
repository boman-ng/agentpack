name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    name: Package and release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const tag = process.env.RELEASE_TAG;
          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          const expected = `v${packageJson.version}`;
          if (!/^v\d+\.\d+\.\d+$/.test(tag) || tag !== expected) {
            console.error(`Release tag ${tag} must be the stable package version ${expected}`);
            process.exit(1);
          }
          NODE
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release tag $RELEASE_TAG is not contained in origin/main" >&2
            exit 1
          fi
          release_tag_ref="refs/agentpack/release-tag"
          git fetch --force --no-tags origin "refs/tags/$RELEASE_TAG:$release_tag_ref"
          remote_tag_commit="$(git rev-parse "${release_tag_ref}^{commit}")"
          if [[ "$remote_tag_commit" != "$GITHUB_SHA" ]]; then
            echo "Release tag $RELEASE_TAG moved away from workflow commit $GITHUB_SHA" >&2
            exit 1
          fi

      - name: Verify canonical assets and behavior
        run: npm run check

      - name: Build release archive
        run: |
          mkdir release
          npm pack --pack-destination release
          tarball="$(find release -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          if [[ -z "$tarball" ]]; then
            echo "npm pack did not create a tarball" >&2
            exit 1
          fi

      - name: Smoke test packaged CLI
        run: |
          npm install --global --prefix "$RUNNER_TEMP/agentpack-smoke" ./release/*.tgz
          actual_version="$("$RUNNER_TEMP/agentpack-smoke/bin/agentpack" --version)"
          expected_version="${GITHUB_REF_NAME#v}"
          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "Packaged CLI reported $actual_version; expected $expected_version" >&2
            exit 1
          fi

      - name: Write checksums
        working-directory: release
        run: |
          sha256sum *.tgz > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Attest package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.tgz

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag_ref="refs/agentpack/release-tag"
          git fetch --force --no-tags origin "refs/tags/$GITHUB_REF_NAME:$release_tag_ref"
          test "$(git rev-parse "${release_tag_ref}^{commit}")" = "$GITHUB_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              release/*.tgz release/SHA256SUMS \
              --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "AgentPack $GITHUB_REF_NAME" \
              --latest
          else
            gh release create "$GITHUB_REF_NAME" \
              release/*.tgz release/SHA256SUMS \
              --verify-tag \
              --generate-notes \
              --title "AgentPack $GITHUB_REF_NAME" \
              --latest \
              --fail-on-no-commits
          fi
