name: AgentPack validation

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]

permissions:
  contents: read

jobs:
  agentpack-validation:
    name: agentpack-validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.15'

      - name: Install reference metadata validator
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/skills-ref-venv"
          "$RUNNER_TEMP/skills-ref-venv/bin/python" -m pip install \
            'git+https://github.com/agentskills/agentskills.git@f130f348f502d9804278a617f86929846896d2e9#subdirectory=skills-ref'

      - name: Validate local skill metadata
        shell: bash
        run: |
          git ls-files -z 'skills/*/SKILL.md' |
            while IFS= read -r -d '' skill_file; do
              "$RUNNER_TEMP/skills-ref-venv/bin/skills-ref" validate "$skill_file"
            done

      - name: Select tracked Markdown
        shell: bash
        run: git ls-files '*.md' > "$RUNNER_TEMP/agentpack-markdown-files.txt"

      - name: Check local Markdown links and anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --offline --include-fragments --no-progress --files-from "$RUNNER_TEMP/agentpack-markdown-files.txt"
          output: ${{ runner.temp }}/agentpack-lychee-report.md
